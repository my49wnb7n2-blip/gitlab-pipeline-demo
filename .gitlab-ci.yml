stages:
  - lint
  - integration-test
  - local-plan
  - local-cleanup

default:
  tags:
    - db-maintenance

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - when: never

variables:
  MAINTENANCE_TASK: "cleanup_audit_logs_test"
  RETENTION_DAYS: "90"
  BATCH_SIZE: "5000"
  BATCH_SLEEP_SECONDS: "1"
  MAX_DELETE_ROWS: "1000000"

.code_check_rules:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: >
        ($CI_PIPELINE_SOURCE == "schedule" ||
         $CI_PIPELINE_SOURCE == "web") &&
        $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH &&
        $MAINTENANCE_TASK == "cleanup_audit_logs_test"
    - when: never

.local_database_job:
  before_script:
    - export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
    - test -n "${DATABASE_URL:-}"
    - test -x scripts/maintenance.sh
    - command -v psql
    - pg_isready -d "$DATABASE_URL"
  environment:
    name: local-production
    deployment_tier: production
  timeout: 1h
  interruptible: false
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

lint:
  extends: .code_check_rules
  stage: lint
  before_script:
    - export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
  script:
    - sh -n scripts/maintenance.sh
    - sh -n scripts/run_local_test.sh

integration_test:
  extends: .code_check_rules
  stage: integration-test
  before_script:
    - export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
  script:
    - scripts/run_local_test.sh

local_plan:
  extends: .local_database_job
  stage: local-plan
  needs:
    - integration_test
  script:
    - scripts/maintenance.sh plan
    - cat plan.env
  artifacts:
    reports:
      dotenv: plan.env
    paths:
      - plan.env
    expire_in: 7 days
  rules:
    - if: >
        $CI_PIPELINE_SOURCE == "web" &&
        $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH &&
        $MAINTENANCE_TASK == "cleanup_audit_logs_test"
    - when: never

local_cleanup:
  extends: .local_database_job
  stage: local-cleanup
  needs:
    - integration_test
    - job: local_plan
      artifacts: false
      optional: true
  script:
    - scripts/maintenance.sh plan
    - cat plan.env
    - scripts/maintenance.sh apply
    - scripts/maintenance.sh verify
  artifacts:
    paths:
      - plan.env
      - cleanup-report.env
    expire_in: 30 days
  resource_group: audit-logs-test-local
  rules:
    - if: >
        $CI_PIPELINE_SOURCE == "schedule" &&
        $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH &&
        $MAINTENANCE_TASK == "cleanup_audit_logs_test"
    - if: >
        $CI_PIPELINE_SOURCE == "web" &&
        $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH &&
        $MAINTENANCE_TASK == "cleanup_audit_logs_test"
      when: manual
    - when: never
  allow_failure: false
  manual_confirmation: "确认清理本机 PostgreSQL 中超过 90 天的 audit_logs_test 数据吗？"
