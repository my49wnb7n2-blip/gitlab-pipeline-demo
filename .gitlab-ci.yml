stages:
  - lint
  - integration-test
  - local-plan
  - local-cleanup

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - when: never

variables:
  RETENTION_DAYS: "90"
  BATCH_SIZE: "5000"
  BATCH_SLEEP_SECONDS: "1"
  MAX_DELETE_ROWS: "1000000"

.code_check_rules:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: >
        ($CI_PIPELINE_SOURCE == "schedule" ||
         $CI_PIPELINE_SOURCE == "web") &&
        $MAINTENANCE_TASK == "cleanup_audit_logs_test"
    - when: never

.local_database_job:
  tags:
    - db-maintenance
  before_script:
    - export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
    - test -n "${DATABASE_URL:-}"
    - test -x scripts/maintenance.sh
    - command -v psql
    - pg_isready -d "$DATABASE_URL"
  environment:
    name: local-production
    deployment_tier: production
  timeout: 1h
  interruptible: false
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
  rules:
    - if: >
        ($CI_PIPELINE_SOURCE == "schedule" ||
         $CI_PIPELINE_SOURCE == "web") &&
        $MAINTENANCE_TASK == "cleanup_audit_logs_test"
    - when: never

lint:
  extends: .code_check_rules
  stage: lint
  image: alpine:3.22
  before_script:
    - apk add --no-cache shellcheck
  script:
    - shellcheck scripts/*.sh
    - sh -n scripts/maintenance.sh
    - sh -n scripts/run_local_test.sh

integration_test:
  extends: .code_check_rules
  stage: integration-test
  image: postgres:18-alpine
  services:
    - name: postgres:18-alpine
      alias: postgres
  variables:
    POSTGRES_DB: maintenance_test
    POSTGRES_USER: test_user
    POSTGRES_PASSWORD: test_password
    DATABASE_URL: postgresql://test_user:test_password@postgres:5432/maintenance_test
    RETENTION_DAYS: "90"
    BATCH_SIZE: "2"
    BATCH_SLEEP_SECONDS: "0"
    MAX_DELETE_ROWS: "100"
  before_script:
    - until pg_isready -h postgres -U "$POSTGRES_USER"; do sleep 1; done
    - psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f sql/schema.sql
    - psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f sql/indexes.sql
    - psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f sql/seed_test_data.sql
  script:
    - scripts/maintenance.sh plan
    - scripts/maintenance.sh apply
    - scripts/maintenance.sh verify
    - test "$(psql "$DATABASE_URL" -X -qAt -c 'SELECT count(*) FROM audit_logs_test;')" = "2"
    - test "$(psql "$DATABASE_URL" -X -qAt -c 'SELECT count(*) FROM audit_logs_test WHERE uuid IS NULL;')" = "0"

local_plan:
  extends: .local_database_job
  stage: local-plan
  needs:
    - integration_test
  script:
    - scripts/maintenance.sh plan
    - cat plan.env
  artifacts:
    reports:
      dotenv: plan.env
    paths:
      - plan.env
    expire_in: 7 days
  rules:
    - if: >
        $CI_PIPELINE_SOURCE == "web" &&
        $MAINTENANCE_TASK == "cleanup_audit_logs_test"
    - when: never

local_cleanup:
  extends: .local_database_job
  stage: local-cleanup
  needs:
    - integration_test
    - job: local_plan
      artifacts: false
      optional: true
  script:
    - scripts/maintenance.sh plan
    - cat plan.env
    - scripts/maintenance.sh apply
    - scripts/maintenance.sh verify
  artifacts:
    paths:
      - plan.env
      - cleanup-report.env
    expire_in: 30 days
  resource_group: audit-logs-test-local
  rules:
    - if: >
        $CI_PIPELINE_SOURCE == "schedule" &&
        $MAINTENANCE_TASK == "cleanup_audit_logs_test"
    - if: >
        $CI_PIPELINE_SOURCE == "web" &&
        $MAINTENANCE_TASK == "cleanup_audit_logs_test"
      when: manual
    - when: never
  allow_failure: false
  manual_confirmation: "确认清理本机 PostgreSQL 中超过 90 天的 audit_logs_test 数据吗？"
