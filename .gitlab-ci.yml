stages:
  - lint
  - integration-test
  - dev-plan
  - dev-apply
  - dev-verify
  - staging-plan
  - staging-apply
  - staging-verify
  - production-plan
  - production-apply
  - production-verify

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - when: never

variables:
  RETENTION_DAYS: "90"
  BATCH_SIZE: "5000"
  BATCH_SLEEP_SECONDS: "1"
  MAX_DELETE_ROWS: "1000000"

.code_check_rules:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - when: never

.maintenance_job:
  image: postgres:18-alpine
  tags:
    - db-maintenance
  before_script:
    - test -n "$DATABASE_URL"
    - test -x scripts/maintenance.sh
  timeout: 1h
  interruptible: false
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
  rules:
    - if: >
        ($CI_PIPELINE_SOURCE == "schedule" ||
         $CI_PIPELINE_SOURCE == "web") &&
        $MAINTENANCE_TASK == "cleanup_audit_logs"
    - when: never

.plan_job:
  extends: .maintenance_job
  script:
    - scripts/maintenance.sh plan
    - cat plan.env
  artifacts:
    reports:
      dotenv: plan.env
    paths:
      - plan.env
    expire_in: 7 days

.apply_job:
  extends: .maintenance_job
  script:
    - scripts/maintenance.sh apply
  artifacts:
    paths:
      - cleanup-report.env
    expire_in: 30 days

.verify_job:
  extends: .maintenance_job
  script:
    - scripts/maintenance.sh verify

lint:
  extends: .code_check_rules
  stage: lint
  image: alpine:3.22
  before_script:
    - apk add --no-cache shellcheck
  script:
    - shellcheck scripts/*.sh
    - sh -n scripts/maintenance.sh
    - sh -n scripts/run_local_test.sh

integration_test:
  extends: .code_check_rules
  stage: integration-test
  image: postgres:18-alpine
  services:
    - name: postgres:18-alpine
      alias: postgres
  variables:
    POSTGRES_DB: maintenance_test
    POSTGRES_USER: test_user
    POSTGRES_PASSWORD: test_password
    DATABASE_URL: postgresql://test_user:test_password@postgres:5432/maintenance_test
    RETENTION_DAYS: "90"
    BATCH_SIZE: "2"
    BATCH_SLEEP_SECONDS: "0"
    MAX_DELETE_ROWS: "100"
  before_script:
    - until pg_isready -h postgres -U "$POSTGRES_USER"; do sleep 1; done
    - psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f sql/schema.sql
    - psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f sql/indexes.sql
    - psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f sql/seed_test_data.sql
  script:
    - scripts/maintenance.sh plan
    - scripts/maintenance.sh apply
    - scripts/maintenance.sh verify
    - test "$(psql "$DATABASE_URL" -X -qAt -c 'SELECT count(*) FROM audit_logs;')" = "2"
    - test "$(psql "$DATABASE_URL" -X -qAt -c 'SELECT count(*) FROM audit_logs WHERE id IS NULL;')" = "0"

dev_plan:
  extends: .plan_job
  stage: dev-plan
  environment:
    name: dev
    deployment_tier: development
    action: verify
  resource_group: audit-log-cleanup-dev

dev_apply:
  extends: .apply_job
  stage: dev-apply
  needs:
    - job: dev_plan
      artifacts: true
  environment:
    name: dev
    deployment_tier: development
  resource_group: audit-log-cleanup-dev

dev_verify:
  extends: .verify_job
  stage: dev-verify
  needs:
    - job: dev_plan
      artifacts: true
    - job: dev_apply
      artifacts: false
  environment:
    name: dev
    deployment_tier: development
    action: verify
  resource_group: audit-log-cleanup-dev

staging_plan:
  extends: .plan_job
  stage: staging-plan
  needs:
    - dev_verify
  environment:
    name: staging
    deployment_tier: staging
    action: verify
  resource_group: audit-log-cleanup-staging

staging_apply:
  extends: .apply_job
  stage: staging-apply
  needs:
    - job: staging_plan
      artifacts: true
  environment:
    name: staging
    deployment_tier: staging
  resource_group: audit-log-cleanup-staging

staging_verify:
  extends: .verify_job
  stage: staging-verify
  needs:
    - job: staging_plan
      artifacts: true
    - job: staging_apply
      artifacts: false
  environment:
    name: staging
    deployment_tier: staging
    action: verify
  resource_group: audit-log-cleanup-staging

production_plan:
  extends: .plan_job
  stage: production-plan
  needs:
    - staging_verify
  environment:
    name: production-plan
    deployment_tier: production
    action: verify
  resource_group: audit-log-cleanup-production
  artifacts:
    reports:
      dotenv: plan.env
    paths:
      - plan.env
    expire_in: 30 days

production_apply:
  extends: .apply_job
  stage: production-apply
  needs:
    - job: production_plan
      artifacts: true
  environment:
    name: production
    deployment_tier: production
  resource_group: audit-log-cleanup-production
  when: manual
  allow_failure: false
  manual_confirmation: "确认清理 production 中超过 90 天的 audit_logs 数据吗？"

production_verify:
  extends: .verify_job
  stage: production-verify
  needs:
    - job: production_plan
      artifacts: true
    - job: production_apply
      artifacts: false
  environment:
    name: production-plan
    deployment_tier: production
    action: verify
  resource_group: audit-log-cleanup-production

